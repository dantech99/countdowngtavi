<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Banner · ¿A qué hora sale GTA 6?</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@500;700;800&display=swap" rel="stylesheet">
<style>
	:root {
		--pink: #c9457f;
		--keyline: #17070f;
	}
	* { box-sizing: border-box; margin: 0; padding: 0; }
	html, body { width: 1080px; height: 1080px; background: #0b0710; }
	.banner {
		position: relative;
		width: 1080px;
		height: 1080px;
		overflow: hidden;
		font-family: 'Inter', sans-serif;
		color: #fff;
	}
	/* Key art fills the top half, then fades into the dark panel that holds
	   the schedule. */
	.art {
		position: absolute;
		inset: 0 0 auto 0;
		height: 600px;
		background: url('../../src/content/articulos/_assets/portada.jpg') 0 -40px / 1700px auto no-repeat;
	}
	.art::after {
		content: '';
		position: absolute;
		inset: 0;
		background: linear-gradient(to bottom, rgb(11 7 16 / 0.15) 0%, rgb(11 7 16 / 0.35) 45%, #0b0710 100%);
	}
	.content {
		position: relative;
		z-index: 1;
		display: flex;
		flex-direction: column;
		height: 100%;
		padding: 56px 64px 48px;
	}
	.kicker {
		align-self: flex-start;
		background: var(--pink);
		padding: 8px 16px;
		font-weight: 800;
		font-size: 22px;
		letter-spacing: 0.08em;
		text-transform: uppercase;
		box-shadow: 4px 4px 0 var(--keyline);
	}
	h1 {
		margin-top: 22px;
		font-family: 'Anton', sans-serif;
		font-weight: 400;
		font-size: 118px;
		line-height: 0.95;
		text-transform: uppercase;
		letter-spacing: 0.01em;
		/* Same stacked keyline + pink slab as the site's .gta-outline. */
		text-shadow:
			-0.042em -0.042em 0 var(--keyline),
			0.042em -0.042em 0 var(--keyline),
			-0.042em 0.042em 0 var(--keyline),
			0.042em 0.042em 0 var(--keyline),
			-0.06em 0 0 var(--keyline),
			0.06em 0 0 var(--keyline),
			0 -0.06em 0 var(--keyline),
			0 0.06em 0 var(--keyline),
			0.07em 0.09em 0 var(--pink),
			0.1em 0.13em 0.18em rgb(0 0 0 / 0.5);
	}
	.lead {
		margin-top: 22px;
		font-size: 32px;
		font-weight: 700;
		text-shadow: 0 2px 12px rgb(0 0 0 / 0.8);
	}
	.lead strong { color: #ff8fc0; }
	.big {
		margin-top: auto;
		text-align: center;
		font-family: 'Anton', sans-serif;
		font-size: 330px;
		line-height: 0.9;
		color: #fff;
		text-shadow:
			-0.03em -0.03em 0 var(--keyline), 0.03em -0.03em 0 var(--keyline),
			-0.03em 0.03em 0 var(--keyline), 0.03em 0.03em 0 var(--keyline),
			0.05em 0.07em 0 var(--pink);
	}
	.big small {
		display: block;
		font-size: 64px;
		letter-spacing: 0.06em;
		color: #ff8fc0;
		text-shadow: none;
		margin-top: 8px;
	}
	.footer {
		display: flex;
		justify-content: space-between;
		align-items: flex-end;
		margin-top: 28px;
		font-size: 18px;
		color: rgb(255 255 255 / 0.65);
	}
	.footer .url { font-size: 24px; font-weight: 800; color: #fff; }
</style>
</head>
<body>
<div class="banner">
	<div class="art"></div>
	<div class="content">
		<p class="kicker">Cuenta regresiva · GTA VI</p>
		<h1>Faltan<br>menos de 3<br>semanas</h1>
		<div class="big">19<small>DE NOVIEMBRE</small></div>
		<div class="footer">
			<p>PS5 y Xbox Series X|S · 19 de noviembre de 2026</p>
			<p class="url">countdowngtavi.com</p>
		</div>
	</div>
</div>
</body>
</html>
